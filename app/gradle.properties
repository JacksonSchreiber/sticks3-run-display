# The build PC is memory constrained, so every JVM here is capped on purpose.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# One module, so parallel execution buys nothing and costs a second daemon.
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true

# --- Built-in Kotlin escape hatch -------------------------------------------
# AGP 9 compiles Kotlin itself and rejects the `org.jetbrains.kotlin.android`
# plugin. If that ever needs to be reverted, uncomment the line below and the
# two marked blocks in gradle/libs.versions.toml and app/build.gradle.kts.
# android.builtInKotlin=false
